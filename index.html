<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEU4 2027</title>
    <meta name="theme-color" content="#0d0d0d">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo.png?v=2">
    <link rel="apple-touch-icon" href="assets/logo-icon.png?v=2">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BLEU4">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="logo-block">
            <img src="assets/logo.png?v=2" alt="BLEU4" class="login-logo">
            <h1>BLEU4</h1>
            <p>GESTION DES ACTIVITÉS</p>
            <p class="login-year">2027</p>
        </div>

        <div class="login-form">

            <label for="role">Type de connexion</label>
            <select id="role">
                <option value="membre">Membre</option>
                <option value="commandement">Commandement</option>
            </select>

            <label for="login">Identifiant</label>
            <input
                id="login"
                type="text"
                placeholder="GRADE NOM ou identifiant"
                autocomplete="username"
                autocapitalize="characters"
            >

            <div id="groupBox">
                <label for="group">Groupe</label>
                <select id="group">
                    <option value="">Choisir un groupe</option>
                    <option value="1">Groupe 1</option>
                    <option value="2">Groupe 2</option>
                    <option value="3">Groupe 3</option>
                </select>
            </div>

            <div id="passwordBox" style="display:none;">
                <label for="password">Code commandement</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Code d'accès"
                    autocomplete="current-password"
                >
            </div>

            <button id="btnLogin" type="button">
                CONNEXION
            </button>

            <p id="loginError" class="login-error" role="alert"></p>

        </div>

    </main>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
