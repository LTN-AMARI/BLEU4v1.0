
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLEU4 2027 - Connexion</title>

    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="BLEU4 - Gestion des activités">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-logo">
            <img src="assets/logo.png" alt="BLEU4">
            <h1>BLEU4</h1>
            <p>GESTION DES ACTIVITÉS 2027</p>
        </div>

        <section class="login-panel">

            <h2>CONNEXION</h2>

            <div class="form-group">
                <label for="role">Type de connexion</label>

                <select id="role">
                    <option value="membre">MEMBRE</option>
                    <option value="commandement">COMMANDEMENT</option>
                </select>
            </div>

            <div class="form-group">
                <label for="login">Grade / Nom ou profil</label>

                <input
                    type="text"
                    id="login"
                    placeholder="Ex : SDT PINGOUIN"
                    autocomplete="username"
                    required
                >
            </div>

            <div id="groupBox" class="form-group">
                <label for="group">Groupe</label>

                <select id="group">
                    <option value="1">Groupe 1</option>
                    <option value="2">Groupe 2</option>
                    <option value="3">Groupe 3</option>
                </select>
            </div>

            <div id="passwordBox" class="form-group" style="display:none;">
                <label for="password">Code d'accès</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Code d'accès"
                    autocomplete="current-password"
                >
            </div>

            <p id="loginError" class="login-error"></p>

            <button id="btnLogin" class="btn-primary">
                SE CONNECTER
            </button>

        </section>

        <footer class="login-footer">
            BLEU4 — 2027
        </footer>

    </main>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
