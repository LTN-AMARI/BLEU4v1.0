
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLEU4 v2</title>

    <meta name="theme-color" content="#0d0d0d">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo.png?v=2">
    <link rel="apple-touch-icon" href="assets/logo-icon.png?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================================
         ECRAN DE CHARGEMENT
    =================================== -->

    <div id="splashScreen">
        <div class="splash-content">
            <img src="assets/logo.png" alt="BLEU4" class="splash-logo">
            <h1>BLEU4</h1>
            <p>GESTION DES ACTIVITÉS</p>
            <div class="splash-loader"></div>
        </div>
    </div>


    <!-- ==================================
         BARRE SUPERIEURE
    =================================== -->

    <header class="topbar">

        <div class="topbar-brand">
            <img src="assets/logo.png" alt="BLEU4" class="topbar-logo">
            <div>
                <h1>BLEU4</h1>
                <span>GESTION DES ACTIVITÉS</span>
            </div>
        </div>

        <div class="topbar-user">
            <span id="userInfo"></span>
            <button id="logoutBtn" class="btn-delete">
                Déconnexion
            </button>
        </div>

    </header>


    <!-- ==================================
         CONTENU PRINCIPAL
    =================================== -->

    <main class="container">


        <!-- ==================================
             NOTIFICATIONS / MISSIONS EN ATTENTE
        =================================== -->

        <div id="pendingBanner" class="hidden"></div>


        <!-- ==================================
             CALENDRIER
        =================================== -->

        <section class="card calendar-card">

            <div class="calendar-header">

                <button id="prevMonth" class="calendar-nav">
                    &#10094;
                </button>

                <h2 id="monthTitle"></h2>

                <button id="nextMonth" class="calendar-nav">
                    &#10095;
                </button>

            </div>

            <div id="weekdays" class="weekdays"></div>

            <div id="calendar" class="calendar"></div>

        </section>


        <!-- ==================================
             MISSIONS DU JOUR
        =================================== -->

        <section class="card">

            <h2 class="section-title">
                MISSIONS DU JOUR
            </h2>

            <h3 id="selectedDateTitle"></h3>

            <div id="missions"></div>

        </section>


        <!-- ==================================
             CREATION DE MISSION
             CDS ET CDG
        =================================== -->

        <section id="createMissionBox" class="card">

            <h2 class="section-toggle">
                CRÉER UNE MISSION
                <span class="toggle-arrow">＋</span>
            </h2>

            <div class="section-body hidden">

                <div class="form-group">

                    <label for="mTitle">Titre de la mission</label>
                    <input
                        type="text"
                        id="mTitle"
                        placeholder="Titre de la mission"
                    >

                </div>


                <div class="form-group">

                    <label for="mDesc">Description</label>
                    <textarea
                        id="mDesc"
                        rows="3"
                        placeholder="Description de la mission"
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="mStart">Date de début</label>
                        <input
                            type="text"
                            id="mStart"
                            inputmode="numeric"
                            maxlength="10"
                            placeholder="JJ/MM/AAAA"
                        >

                    </div>

                    <div class="form-group">

                        <label for="mEnd">Date de fin</label>
                        <input
                            type="text"
                            id="mEnd"
                            inputmode="numeric"
                            maxlength="10"
                            placeholder="JJ/MM/AAAA"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="mLocation">Lieu</label>
                    <input
                        type="text"
                        id="mLocation"
                        placeholder="Lieu de la mission"
                    >

                </div>


                <div class="form-group">

                    <label for="mConcerned">Personnel concerné</label>
                    <input
                        type="text"
                        id="mConcerned"
                        placeholder="Tous ou noms séparés par des virgules"
                    >

                    <small>
                        Indiquer « Tous » ou les noms des personnels concernés.
                    </small>

                </div>


                <!-- PATRACDR -->

                <div class="patracdr-toggle">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="patracdrToggle"
                        >

                        Ajouter un PATRACDR

                    </label>

                </div>


                <div id="patracdrFields" class="patracdr-fields hidden">

                    <h3>PATRACDR</h3>

                    <div class="form-group">
                        <label for="pPersonnel">Personnel</label>
                        <textarea id="pPersonnel" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pArmement">Armement</label>
                        <textarea id="pArmement" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pTenue">Tenue</label>
                        <textarea id="pTenue" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pRadio">Radio</label>
                        <textarea id="pRadio" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pAlimentation">Alimentation</label>
                        <textarea id="pAlimentation" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pCamouflage">Camouflage</label>
                        <textarea id="pCamouflage" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pDivers">Divers</label>
                        <textarea id="pDivers" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="pRassemblement">Rassemblement</label>
                        <textarea id="pRassemblement" rows="2"></textarea>
                    </div>

                </div>


                <button id="createBtn" class="btn-present">
                    CRÉER LA MISSION
                </button>

            </div>

        </section>


        <!-- ==================================
             TOUTES LES MISSIONS
        =================================== -->

        <section id="allMissionsBox" class="card">

            <h2 class="section-toggle">
                MISSIONS EN COURS
                <span class="toggle-arrow">＋</span>
            </h2>

            <div class="section-body hidden">
                <div id="allMissionsList"></div>
            </div>

        </section>


        <!-- ==================================
             MISSIONS ARCHIVEES
        =================================== -->

        <section id="archivedMissionsBox" class="card">

            <h2 class="section-toggle">
                MISSIONS ARCHIVÉES
                <span class="toggle-arrow">＋</span>
            </h2>

            <div class="section-body hidden">
                <div id="archivedMissionsList"></div>
            </div>

        </section>


        <!-- ==================================
             COMPTEUR DE PRESENCE
        =================================== -->

        <section id="presenceCounterBox" class="card">

            <h2 class="section-toggle">
                SUIVI DES PRÉSENCES
                <span class="toggle-arrow">＋</span>
            </h2>

            <div class="section-body hidden">
                <div id="presenceCounterList"></div>
            </div>

        </section>


    </main>


    <!-- ==================================
         APPLICATION JAVASCRIPT
    =================================== -->

    <script type="module" src="js/app.js"></script>

</body>
</html>
