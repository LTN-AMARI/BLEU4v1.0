
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLEU4 2027</title>

    <meta name="theme-color" content="#0d0d0d">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo.png?v=2">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-page">

    <!-- ==================================
         ECRAN DE CHARGEMENT
    =================================== -->

    <div id="splashScreen">
        <img class="splash-logo" src="assets/logo.png" alt="BLEU4">
        <h1>BLEU4</h1>
        <p>GESTION DES ACTIVITÉS</p>
    </div>


    <!-- ==================================
         ENTETE
    =================================== -->

    <header class="app-header">

        <div class="header-brand">
            <img src="assets/logo.png" alt="BLEU4">
            <div>
                <h1>BLEU4 2027</h1>
                <p>GESTION DES ACTIVITÉS</p>
            </div>
        </div>

        <div class="header-user">
            <span id="userInfo"></span>
            <button id="logoutBtn" class="btn-secondary" type="button">
                DÉCONNEXION
            </button>
        </div>

    </header>


    <main class="app-container">

        <!-- ==================================
             NOTIFICATIONS
        =================================== -->

        <div id="pendingBanner" class="pending-banner hidden"></div>


        <!-- ==================================
             CALENDRIER
        =================================== -->

        <section class="panel calendar-panel">

            <h2>CALENDRIER DES ACTIVITÉS</h2>

            <div class="calendar-navigation">

                <button id="prevMonth" type="button"
                    class="btn-secondary">
                    ◀
                </button>

                <h3 id="monthTitle"></h3>

                <button id="nextMonth" type="button"
                    class="btn-secondary">
                    ▶
                </button>

            </div>

            <div id="weekdays" class="weekdays"></div>

            <div id="calendar" class="calendar-grid"></div>

            <h3 id="selectedDateTitle"></h3>

            <div id="missions"></div>

        </section>


        <!-- ==================================
             CREATION DE MISSION
        =================================== -->

        <section id="createMissionBox" class="panel">

            <h2 class="section-toggle">
                CRÉER UNE MISSION
                <span>▼</span>
            </h2>

            <div class="section-content">

                <div class="form-group">
                    <label for="mTitle">Titre de la mission</label>
                    <input id="mTitle" type="text"
                        placeholder="Intitulé de la mission">
                </div>

                <div class="form-group">
                    <label for="mDesc">Description</label>
                    <textarea id="mDesc"
                        placeholder="Description de la mission"></textarea>
                </div>

                <div class="form-group">
                    <label for="mStart">Date de début</label>
                    <input id="mStart" type="text"
                        placeholder="JJ/MM/AAAA">
                </div>

                <div class="form-group">
                    <label for="mEnd">Date de fin</label>
                    <input id="mEnd" type="text"
                        placeholder="JJ/MM/AAAA">
                </div>

                <div class="form-group">
                    <label for="mLocation">Lieu</label>
                    <input id="mLocation" type="text"
                        placeholder="Lieu de la mission">
                </div>

                <div class="form-group">
                    <label for="mGroup">Groupe concerné</label>
                    <select id="mGroup">
                        <option value="1">GROUPE 1</option>
                        <option value="2">GROUPE 2</option>
                        <option value="3">GROUPE 3</option>
                        <option value="all">TOUS LES GROUPES</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mConcerned">
                        Personnel concerné
                    </label>
                    <input id="mConcerned" type="text"
                        placeholder="Tous ou identifiants séparés par des virgules">
                </div>


                <!-- PATRACDR -->

                <div class="patracdr-container">

                    <label class="checkbox-line">
                        <input id="patracdrToggle" type="checkbox">
                        Ajouter un PATRACDR
                    </label>

                    <div id="patracdrFields" class="hidden">

                        <div class="form-group">
                            <label for="pPersonnel">Personnel</label>
                            <input id="pPersonnel" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pArmement">Armement</label>
                            <input id="pArmement" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pTenue">Tenue</label>
                            <input id="pTenue" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pRadio">Radio</label>
                            <input id="pRadio" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pAlimentation">Alimentation</label>
                            <input id="pAlimentation" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pCamouflage">Camouflage</label>
                            <input id="pCamouflage" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pDivers">Divers</label>
                            <input id="pDivers" type="text">
                        </div>

                        <div class="form-group">
                            <label for="pRassemblement">Rassemblement</label>
                            <input id="pRassemblement" type="text">
                        </div>

                    </div>

                </div>

                <button id="createBtn" class="btn-primary"
                    type="button">
                    CRÉER LA MISSION
                </button>

            </div>

        </section>


        <!-- ==================================
             GESTION DU PERSONNEL
        =================================== -->

        <section id="personnelBox" class="panel">

            <h2 class="section-toggle">
                GESTION DU PERSONNEL
                <span>▼</span>
            </h2>

            <div class="section-content">

                <!-- Formulaire réservé au CDS -->

                <div id="personnelFormBox" class="hidden">

                    <h3 id="personnelFormTitle">
                        AJOUTER UN MEMBRE
                    </h3>

                    <div class="form-group">
                        <label for="personnelLogin">
                            Grade et nom
                        </label>
                        <input id="personnelLogin" type="text"
                            placeholder="Exemple : SDT PINGOUIN">
                    </div>

                    <div class="form-group">
                        <label for="personnelGroup">
                            Groupe
                        </label>
                        <select id="personnelGroup">
                            <option value="1">GROUPE 1</option>
                            <option value="2">GROUPE 2</option>
                            <option value="3">GROUPE 3</option>
                        </select>
                    </div>

                    <input id="personnelOriginalLogin"
                        type="hidden">

                    <div class="actions">

                        <button id="savePersonnelBtn"
                            class="btn-primary" type="button">
                            ENREGISTRER
                        </button>

                        <button id="cancelPersonnelBtn"
                            class="btn-secondary" type="button">
                            ANNULER
                        </button>

                    </div>

                </div>


                <div id="personnelActions" class="hidden">

                    <button id="addPersonnelBtn"
                        class="btn-primary" type="button">
                        + AJOUTER UN MEMBRE
                    </button>

                </div>


                <!-- Filtres -->

                <div class="form-group">
                    <label for="personnelFilter">
                        Afficher le groupe
                    </label>

                    <select id="personnelFilter">
                        <option value="all">TOUS LES GROUPES</option>
                        <option value="1">GROUPE 1</option>
                        <option value="2">GROUPE 2</option>
                        <option value="3">GROUPE 3</option>
                    </select>
                </div>


                <!-- Liste du personnel -->

                <div id="personnelList"></div>

            </div>

        </section>


        <!-- ==================================
             TOUTES LES MISSIONS
        =================================== -->

        <section id="allMissionsBox" class="panel">

            <h2 class="section-toggle">
                GESTION DES MISSIONS
                <span>▼</span>
            </h2>

            <div class="section-content">
                <div id="allMissionsList"></div>
            </div>

        </section>


        <!-- ==================================
             ARCHIVES
        =================================== -->

        <section id="archivedMissionsBox" class="panel">

            <h2 class="section-toggle">
                ARCHIVES
                <span>▼</span>
            </h2>

            <div class="section-content">
                <div id="archivedMissionsList"></div>
            </div>

        </section>


        <!-- ==================================
             COMPTEUR DE PRESENCE
        =================================== -->

        <section id="presenceCounterBox" class="panel">

            <h2 class="section-toggle">
                SUIVI DES PRÉSENCES
                <span>▼</span>
            </h2>

            <div class="section-content">
                <div id="presenceCounterList"></div>
            </div>

        </section>

    </main>


    <!-- ==================================
         PIED DE PAGE
    =================================== -->

    <footer class="app-footer">
        BLEU4 2027 — GESTION DES ACTIVITÉS
    </footer>


    <!-- ==================================
         SCRIPTS
    =================================== -->

    <script type="module" src="js/app.js"></script>

</body>
</html>
